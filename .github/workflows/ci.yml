name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/opencode-unity
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: bun install --frozen-lockfile
      - run: bun run build:exporter
      - run: bun run typecheck
      - run: bun test
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun run test:node

  prototype:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/opencode-game-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Ubuntu 24.04 forbids the user namespaces Chrome's sandbox is made of, to anything without
      # an AppArmor profile. Lifted here so the browser test runs on Linux too.
      - if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun run test:node

  # The Windows installer used in classrooms, run on the package a release would ship.
  installer:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh] # Windows PowerShell 5.1 (preinstalled) and PowerShell 7
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the package
        working-directory: packages/opencode-unity
        run: |
          bun install --frozen-lockfile
          npm pack
      - name: Install, load, uninstall
        run: |
          $env:OPENCODE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "opencode-config"
          $package = (Get-Item packages/opencode-unity/opencode-unity-*.tgz).FullName
          & ./install.ps1 -Package $package
          $plugin = Join-Path $env:OPENCODE_CONFIG_DIR "plugins\opencode-unity.js"
          $dll = Join-Path $env:OPENCODE_CONFIG_DIR "opencode-unity\symbol-exporter\symbol-exporter.dll"
          $probe = Join-Path $env:OPENCODE_CONFIG_DIR "opencode-unity\unity-probe\Editor\Probe.cs"
          if (-not (Test-Path $plugin) -or -not (Test-Path $dll) -or -not (Test-Path $probe)) { throw "files missing after install" }
          $url = ([System.Uri]$plugin).AbsoluteUri
          node --input-type=module -e "const m = await import('$url'); const p = m.default; if (p.id !== 'opencode-unity' || typeof p.setup !== 'function' || typeof p.server !== 'function') throw new Error('bad plugin export'); console.log('installed plugin loads')"
          if ($LASTEXITCODE -ne 0) { throw "the installed plugin does not load" }
          & ./install.ps1 -Uninstall
          if (Test-Path $plugin) { throw "uninstall left the plugin in place" }

  # The same for the second plugin, and a test play in the runner's own Edge through the installed copy.
  installer-prototype:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the package
        working-directory: packages/opencode-game-prototype
        run: |
          bun install --frozen-lockfile
          npm pack
      - name: Install, play a prototype, uninstall
        run: |
          $env:OPENCODE_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "opencode-config"
          $package = (Get-Item packages/opencode-game-prototype/opencode-game-prototype-*.tgz).FullName
          & ./install-game-prototype.ps1 -Package $package
          $plugin = Join-Path $env:OPENCODE_CONFIG_DIR "plugins\opencode-game-prototype.js"
          $three = Join-Path $env:OPENCODE_CONFIG_DIR "opencode-game-prototype\assets\three\three.module.js"
          if (-not (Test-Path $plugin) -or -not (Test-Path $three)) { throw "files missing after install" }
          node packages/opencode-game-prototype/test/installed-check.mjs $plugin
          if ($LASTEXITCODE -ne 0) { throw "the installed plugin does not work" }
          & ./install-game-prototype.ps1 -Uninstall
          if (Test-Path $plugin) { throw "uninstall left the plugin in place" }
